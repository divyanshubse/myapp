server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - name: RemoveRequestHeader
          args:
            name: Cookie
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: student
          uri: http://student-service:8082
          predicates:
            - Path=/api/students/**
          filters:
            - StripPrefix=1
        - id: faculty
          uri: http://faculty-service:8083
          predicates:
            - Path=/api/faculty/**
          filters:
            - StripPrefix=1
        - id: schedule
          uri: http://schedule-service:8084
          predicates:
            - Path=/api/schedule/**
          filters:
            - StripPrefix=1
        - id: attendance
          uri: http://attendance-service:8085
          predicates:
            - Path=/api/attendance/**
          filters:
            - StripPrefix=1
        - id: finance
          uri: http://finance-service:8086
          predicates:
            - Path=/api/finance/**
          filters:
            - StripPrefix=1
        - id: exam
          uri: http://exam-service:8087
          predicates:
            - Path=/api/exam/**
          filters:
            - StripPrefix=1
        - id: notification
          uri: http://notification-service:8088
          predicates:
            - Path=/api/notify/**
          filters:
            - StripPrefix=1
        - id: analytics
          uri: http://analytics-service:8089
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: "*"