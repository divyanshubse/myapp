version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - APP_SECURITY_JWT_SECRET=cXdlcnR5dWlvcGFzZGZnaGprbHp4Y3Zibm0xMjM0NTY=
    ports:
      - "8081:8081"

  student-service:
    build:
      context: .
      dockerfile: ./services/student-service/Dockerfile
    depends_on:
      - mysql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_student?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8082:8082"

  faculty-service:
    build:
      context: .
      dockerfile: ./services/faculty-service/Dockerfile
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_faculty?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    ports:
      - "8083:8083"

  schedule-service:
    build:
      context: .
      dockerfile: ./services/schedule-service/Dockerfile
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_schedule?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    ports:
      - "8084:8084"

  attendance-service:
    build:
      context: .
      dockerfile: ./services/attendance-service/Dockerfile
    depends_on:
      - mysql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_attendance?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8085:8085"

  finance-service:
    build:
      context: .
      dockerfile: ./services/finance-service/Dockerfile
    depends_on:
      - mysql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_finance?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8086:8086"

  exam-service:
    build:
      context: .
      dockerfile: ./services/exam-service/Dockerfile
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/erp_exam?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    ports:
      - "8087:8087"

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8088:8088"

  analytics-service:
    build:
      context: .
      dockerfile: ./services/analytics-service/Dockerfile
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8089:8089"

  gateway-service:
    build:
      context: .
      dockerfile: ./services/gateway-service/Dockerfile
    depends_on:
      - auth-service
      - student-service
      - faculty-service
      - schedule-service
      - attendance-service
      - finance-service
      - exam-service
      - notification-service
      - analytics-service
    ports:
      - "8080:8080"

volumes:
  mysql_data: