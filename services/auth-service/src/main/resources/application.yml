server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://mysql:3306/erp_auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
management:
  endpoints:
    web:
      exposure:
        include: "*"
app:
  security:
    jwt:
      issuer: coaching-erp
      secret: ${APP_SECURITY_JWT_SECRET:change-me-super-secret}
      expiry-minutes: 120