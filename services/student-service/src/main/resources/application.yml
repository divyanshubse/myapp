server:
  port: 8082
spring:
  application:
    name: student-service
  datasource:
    url: jdbc:mysql://mysql:3306/erp_student?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: student-service
management:
  endpoints:
    web:
      exposure:
        include: "*"